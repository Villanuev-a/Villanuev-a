<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130">
  <style>
    .t{font-family:'Playfair Display',Georgia,serif;font-size:20px;letter-spacing:2px;fill:#C9A24A}
    .s{font-family:Georgia,serif;font-size:10px;letter-spacing:3px;fill:#8A8A8A}
    .d{font-family:Georgia,serif;font-size:14px;fill:#EDE6D6}
  </style>
  <defs><clipPath id="c"><rect width="800" height="130"/></clipPath></defs>
  <g clip-path="url(#c)" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="0 0;0 0;-800 0;-800 0;-1600 0" keyTimes="0;0.4;0.5;0.9;1"
        calcMode="spline" keySplines="0 0 1 1;0.6 0 0.2 1;0 0 1 1;0.6 0 0.2 1"/>
      <g>
        <text class="t" x="400" y="34">IA para Alunos e Educadores</text>
        <text class="s" x="400" y="56">FLUTTER · DART · GEMINI API</text>
        <text class="d" x="400" y="86">Web and mobile app that generates educational images with AI.</text>
        <text class="d" x="400" y="108">Full stack development and team lead.</text>
      </g>
      <g transform="translate(800 0)">
        <text class="t" x="400" y="34">Cloud Architecting Capstone</text>
        <text class="s" x="400" y="56">AWS</text>
        <text class="d" x="400" y="86">Student-records web app on AWS,</text>
        <text class="d" x="400" y="108">scaled with load balancing and Auto Scaling.</text>
      </g>
      <g transform="translate(1600 0)">
        <text class="t" x="400" y="34">IA para Alunos e Educadores</text>
        <text class="s" x="400" y="56">FLUTTER · DART · GEMINI API</text>
        <text class="d" x="400" y="86">Web and mobile app that generates educational images with AI.</text>
        <text class="d" x="400" y="108">Full stack development and team lead.</text>
      </g>
    </g>
  </g>
</svg>
